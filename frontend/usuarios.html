<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de usuarios | La Esquina del Café</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="contenido">
      <section class="pantalla">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:18px;">
          <div>
            <h1>Gestión de usuarios</h1>
            <p class="subtitulo">Administra las cuentas de Administrador y Barista/Cajero con acceso al sistema.</p>
          </div>
          <button type="button" class="btn btn-primario" id="btn-nuevo-usuario">+ Nuevo usuario</button>
        </div>

        <div id="msg-usuarios" style="display:none; margin-bottom:14px;"></div>

        <div class="card">
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th>Correo</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Fecha registro</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-usuarios"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal Crear / Editar Usuario -->
  <div class="modal-fondo" id="modal-usuario" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" style="max-width:460px;">
      <h2 id="titulo-modal-usr">Nuevo usuario</h2>
      <div id="error-modal-usr" class="alerta-error" style="display:none; margin-bottom:12px;"></div>

      <form id="form-usuario">
        <input type="hidden" id="usr-id">

        <div class="campo" style="margin-bottom:12px;">
          <label for="usr-nombre">Nombre de usuario</label>
          <input type="text" id="usr-nombre" required>
        </div>

        <div class="campo" style="margin-bottom:12px;">
          <label for="usr-correo">Correo electrónico</label>
          <input type="email" id="usr-correo" required>
        </div>

        <div class="campo" style="margin-bottom:12px;">
          <label for="usr-rol">Rol de acceso</label>
          <select id="usr-rol">
            <option value="Cajero">Cajero / Barista (Caja, Recepción y Mermas)</option>
            <option value="Administrador">Administrador (Acceso total)</option>
          </select>
        </div>

        <div class="campo" style="margin-bottom:12px;">
          <label for="usr-pass" id="lbl-usr-pass">Contraseña (mín. 8 caracteres alfanuméricos)</label>
          <input type="password" id="usr-pass" placeholder="Ej. Cafe2026">
        </div>

        <div class="campo" id="grupo-usr-estado" style="display:none; margin-bottom:12px;">
          <label for="usr-estado">Estado de cuenta</label>
          <select id="usr-estado">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo (bloquea inicio de sesión)</option>
          </select>
        </div>

        <div class="modal-acciones" style="margin-top:16px;">
          <button type="button" class="btn btn-secundario" onclick="cerrarModal('modal-usuario')">Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>

  <script src="js/menu.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
