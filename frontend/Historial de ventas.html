<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas - La Esquina del Café</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        /* Paleta de colores estilo cafetería */
        :root {
            --cafe-oscuro: #3E2723;
            --cafe-medio: #6D4C41;
            --crema-fondo: #FAF6F0;
            --beige-tarjeta: #EFE6DD;
            --verde-exito: #2E7D32;
            --rojo-cancelado: #C62828;
        }

        body {
            background-color: var(--crema-fondo);
            color: var(--cafe-oscuro);
            font-family: 'Segoe UI', sans-serif;
        }

        .contenedor-historial {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(62, 39, 35, 0.08);
        }

        .tabla-ventas {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .tabla-ventas th {
            background-color: var(--cafe-oscuro);
            color: #FFFFFF;
            padding: 12px;
            text-align: left;
        }

        .tabla-ventas td {
            padding: 12px;
            border-bottom: 1px solid var(--beige-tarjeta);
        }

        .tabla-ventas tr:hover {
            background-color: var(--crema-fondo);
        }

        .badge-completada {
            background-color: #E8F5E9;
            color: var(--verde-exito);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <!-- Aquí va tu menú lateral cargado por menu.js -->
    <div id="sidebar-container"></div>

    <main class="contenido-principal">
        <div class="contenedor-historial">
            <h2>Historial de Ventas</h2>
            <table class="tabla-ventas">
                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Fecha y Hora</th>
                        <th>Productos</th>
                        <th>Método de Pago</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-ventas-body">
                    <!-- Se llena dinámicamente desde Python -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/menu.js"></script>
    <script src="js/historial_ventas.js"></script>
</body>
</html>
