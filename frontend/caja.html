<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja | La Esquina del Café</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    /* Distribución específica de 03_Caja (2/3 Productos, 1/3 Comanda) */
    .caja-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      align-items: start;
      margin-top: 16px;
    }

    /* Barra de categorías (Button Bar) */
    .categorias-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn-categoria {
      padding: 10px 18px;
      border: 1px solid #D7CCC8;
      background-color: #E7DCD3;
      color: #4E342E;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-categoria.activa {
      background-color: #C8963E; /* Acento ámbar del diseño */
      color: #FFFFFF;
      border-color: #C8963E;
    }

    /* Cuadrícula de productos (3 columnas) */
    .productos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .btn-producto {
      background-color: #FFFFFF;
      border: 1.5px solid #E0D7CE;
      border-radius: 12px;
      padding: 20px 14px;
      min-height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
    }
    .btn-producto:hover:not(:disabled) {
      border-color: #4E342E;
      box-shadow: 0 4px 10px rgba(78, 52, 46, 0.08);
      transform: translateY(-2px);
    }
    .btn-producto .prod-nombre {
      font-size: 16px;
      font-weight: 700;
      color: #3E2723;
      margin-bottom: 6px;
    }
    .btn-producto .prod-precio {
      font-size: 15px;
      font-weight: 600;
      color: #6D4C41;
    }
    /* Producto sin stock (RF 7.1) */
    .btn-producto:disabled {
      background-color: #E0E0E0;
      border-color: #BDBDBD;
      cursor: not-allowed;
    }
    .btn-producto:disabled .prod-nombre,
    .btn-producto:disabled .prod-precio {
      color: #9E9E9E;
    }

    /* Panel derecho: Comanda */
    .panel-comanda {
      background-color: #F5F0EB; /* Crema suave del diseño */
      border: 1px solid #E0D7CE;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 460px;
    }
    .panel-comanda h2 {
      color: #4E342E;
      font-size: 18px;
      margin-bottom: 12px;
      border-bottom: 1px solid #E0D7CE;
      padding-bottom: 8px;
    }
    .tabla-comanda-wrap {
      flex: 1;
      overflow-y: auto;
      max-height: 260px;
      margin-bottom: 12px;
    }
    .tabla-comanda {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .tabla-comanda th {
      background-color: #E7DCD3;
      color: #4E342E;
      padding: 8px;
      text-align: left;
    }
    .tabla-comanda td {
      padding: 8px 6px;
      border-bottom: 1px solid #E0D7CE;
    }
    .ctrl-cant {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-cant {
      width: 24px;
      height: 24px;
      border: 1px solid #4E342E;
      background: #FFFFFF;
      color: #4E342E;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Alerta de stock insuficiente (RF 7) */
    .alerta-stock {
      display: none;
      background-color: #FFEBEE;
      border: 1px solid #C62828;
      color: #C62828;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .comanda-total {
      font-size: 22px;
      font-weight: 800;
      color: #3E2723;
      text-align: right;
      margin: 10px 0 14px 0;
    }
    .comanda-acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Estilos específicos Modal M3_Cobro */
    .cobro-total-destacado {
      font-size: 24px;
      font-weight: 800;
      color: #4E342E;
      background: #F5F0EB;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin: 12px 0;
    }
    .radios-pago {
      display: flex;
      gap: 20px;
      margin: 8px 0 14px 0;
    }
    .radios-pago label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .nota-tarjeta {
      display: none;
      background: #F5F0EB;
      color: #6D4C41;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .cambio-texto {
      font-size: 20px;
      font-weight: 700;
      color: #2E7D32;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      .caja-layout { grid-template-columns: 1fr; }
      .productos-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Barra superior y menú lateral compartidos -->
  <header class="topbar" id="topbar"></header>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="contenido">
      <section class="pantalla">
        <h1>Caja</h1>
        <p class="subtitulo">Selecciona los productos de la comanda y procesa el cobro.</p>

        <div class="caja-layout">
          <!-- ZONA IZQUIERDA (2/3): Categorías y cuadrícula de productos -->
          <div>
            <div class="categorias-bar" id="categorias-bar">
              <button type="button" class="btn-categoria activa" data-cat="Bebidas calientes">Bebidas calientes</button>
              <button type="button" class="btn-categoria" data-cat="Bebidas frías">Bebidas frías</button>
              <button type="button" class="btn-categoria" data-cat="Alimentos">Alimentos</button>
            </div>

            <div class="productos-grid" id="productos-grid">
              <!-- Se llena dinámicamente desde js/caja.js -->
            </div>
          </div>

          <!-- ZONA DERECHA (1/3): Comanda activa -->
          <aside class="panel-comanda">
            <h2>Comanda</h2>

            <div class="tabla-comanda-wrap">
              <table class="tabla-comanda">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Cant.</th>
                    <th>Subtotal</th>
                  </tr>
                </thead>
                <tbody id="comanda-tbody">
                  <tr>
                    <td colspan="3" style="text-align:center; color:#8D6E63; padding:20px;">
                      Sin productos agregados
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Mensaje de error por stock insuficiente (RF 7) -->
            <div class="alerta-stock" id="alerta-stock">
              Inventario insuficiente. No se realizó el cobro.
            </div>

            <div class="comanda-total" id="comanda-total">Total: $0.00</div>

            <div class="comanda-acciones">
              <button type="button" class="btn btn-secundario" id="btn-cancelar-comanda">
                Cancelar comanda
              </button>
              <button type="button" class="btn btn-primario" id="btn-abrir-cobro">
                Cobrar
              </button>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL M3_Cobro -->
  <div class="modal-fondo" id="modal-cobro" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" style="max-width: 460px;">
      <h2>Cobrar</h2>

      <div class="cobro-total-destacado" id="modal-total-texto">
        Total a cobrar: $0.00
      </div>

      <div class="campo">
        <label>Forma de pago</label>
        <div class="radios-pago">
          <label>
            <input type="radio" name="forma_pago" value="Efectivo" checked> Efectivo
          </label>
          <label>
            <input type="radio" name="forma_pago" value="Tarjeta externa"> Tarjeta externa
          </label>
        </div>
      </div>

      <!-- Bloque para Efectivo -->
      <div id="bloque-efectivo">
        <div class="campo">
          <label for="input-recibido">Recibido ($ MXN)</label>
          <input type="number" id="input-recibido" min="0" step="0.50" placeholder="0.00">
        </div>
        <div class="cambio-texto" id="texto-cambio">Cambio: $0.00</div>
      </div>

      <!-- Nota cuando se selecciona Tarjeta externa -->
      <div class="nota-tarjeta" id="nota-tarjeta">
        Con tarjeta no se captura el monto recibido.
      </div>

      <div class="alerta-error" id="error-cobro" style="display:none; margin-top:10px;"></div>

      <div class="modal-acciones" style="margin-top: 18px;">
        <button type="button" class="btn btn-secundario" onclick="cerrarModal('modal-cobro')">
          Cancelar
        </button>
        <button type="button" class="btn btn-primario" id="btn-confirmar-pago">
          Confirmar pago
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts: menu.js siempre primero, luego caja.js -->
  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/caja.js"></script>
</body>
</html>
